feature: 2026-08-03-relay-deployment-baseline
created: 2026-08-03

steps:
  - action: "配置与 Ops 编排骨架：接入 required assets config 和 command dispatch，保留默认 serve"
    exit_signal: "validate、migrate、serve 分支可执行，错误配置在监听前失败"
    status: done
  - action: "Readiness 与 assets 计算节点：接通 DB/assets readiness 和安全静态资源路由"
    exit_signal: "ready/unready 与资源 200/404/防遍历均有测试"
    status: done
  - action: "Metrics 计算节点：接入低敏 HTTP 聚合指标和 Prometheus 输出"
    exit_signal: "请求计数、status、duration 可观察且不含 path、query、secret"
    status: done
  - action: "SQLite backup 计算节点：实现在线快照、目标守护和 integrity verify"
    exit_signal: "有写入负载时备份可打开且数据一致，错误目标不覆盖"
    status: done
  - action: "Container Stack：构建 Web + Cloud non-root 镜像，提供 Compose、Caddy、env、healthcheck 和 backup 操作"
    exit_signal: "配置文件静态校验通过；Docker 可用时镜像构建和启动探活通过"
    status: done
  - action: "完整验证：回跑 compatibility、race、vet、backup restore 和上游只读边界"
    exit_signal: "V0 所有验收场景有证据，git 变更只在 cloud/** 与 .codestable/**"
    status: done

