feature: 2026-08-03-relay-compatibility-suite
created: 2026-08-03

steps:
  - action: "编排骨架：建立 opt-in Compatibility Run、临时目录、端口、阶段超时和真实 Cloud/Node 进程管理"
    exit_signal: "显式命令能构建并启动两个二进制且可靠清理，默认 go test ./... 只 skip 重型场景"
    status: done

  - action: "绑定计算节点：解析 CLI 绑定观察、管理员登录确认并等待真实 Connector"
    exit_signal: "未修改 CLI 完成 pending 到 confirmed，Public Route /health 返回 Node 的 ok"
    status: done

  - action: "HTTP 与静态计算节点：验证 fixture、method/query/body 和 relayed asset rewrite"
    exit_signal: "真实 Node 的静态内容和 HTTP API 经 Public Route 保持，错误 Header 值可被测试发现"
    status: done

  - action: "E2EE 计算节点：独立实现 open、protected HTTP 和 encrypted WebSocket ping/pong"
    exit_signal: "密文可在测试端解密，proof 使用 Node canonical path，WS pong 顺序正确"
    status: done

  - action: "重连与生命周期：复用 SQLite/config 重启 Test Cloud并验证 Node 自动重连和清理"
    exit_signal: "不重新绑定即可恢复 Public Route，测试结束无残留监听端口和子进程"
    status: done

  - action: "完整验证：补齐错误、脱敏、只读边界和预构建 binary override"
    exit_signal: "全部验收场景有证据，兼容命令通过，普通 cloud tests、race 和 vet 继续通过"
    status: done

