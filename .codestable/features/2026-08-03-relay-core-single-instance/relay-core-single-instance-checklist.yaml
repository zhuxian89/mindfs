feature: 2026-08-03-relay-core-single-instance
created: 2026-08-03

steps:
  - action: "编排骨架：建立独立 cloud module、配置加载、Store/Service 接口和协议兼容路由骨架"
    exit_signal: "cloud 可独立构建启动，healthz 成功，目标路由可达，根 module 和现有源码无改动"
    status: done

  - action: "绑定与凭据计算节点：实现管理员 Session、challenge 状态机、HMAC Token 派生和确认事务"
    exit_signal: "pending、confirmed、claimed、expired、revoked 可观察，confirmed 重试返回相同 Token"
    status: done

  - action: "Connector 计算节点：实现 Bearer 鉴权、WebSocket net.Conn、yamux.Server 和 SessionRegistry"
    exit_signal: "合法 Node 上线，无效 Token 返回指定 401，新连接可靠替换旧连接"
    status: done

  - action: "HTTP Gateway 计算节点：实现 node 路由、stream 打开、路径/Header 改写和流式响应"
    exit_signal: "普通 HTTP、静态资源、API body 和错误响应均能经 yamux 往返"
    status: done

  - action: "WebSocket Gateway 计算节点：实现 101 协调、子协议和 data/close framing 双向桥接"
    exit_signal: "text、binary、正常 close、异常 close 和超限消息符合协议"
    status: done

  - action: "持久化与生命周期：完成 SQLite repository、启动恢复、challenge 过期和连接清理"
    exit_signal: "Cloud 重启后绑定数据仍在，Node 重连恢复，过期和断线无残留 session"
    status: done

  - action: "Feature 内协议验证：覆盖接口、错误、并发、安全和现有代码只读边界"
    exit_signal: "全部验收场景有证据，测试通过，git 变更只包含 cloud/** 与 .codestable/**"
    status: done

