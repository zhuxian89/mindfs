steps:
  - action: "按第 2.5 节方案做微重构：拆分 Relay 浏览器页面职责，只搬现有行为"
    exit_signal: "Cloud 编译与现有 browser handler tests 通过，对外路由和响应行为零变化"
    status: done
  - action: "认证与控制台骨架：让 /login、/nodes、/api/auth/me 和 logout 复用现有 AdminSession"
    exit_signal: "未登录进入登录页，登录后进入安全 next，me/logout 与客户端观察一致且绑定登录不回归"
    status: done
  - action: "客户端节点查询契约：实现 GET /api/nodes 并合并 SQLite 节点与 Registry 在线状态"
    exit_signal: "空集合、多节点、online/offline、确定性排序和存储失败均有可观察结果"
    status: done
  - action: "节点控制台接入：用真实节点数据完成展示、在线打开、离线提示、周期刷新和规范 /n/ anchors"
    exit_signal: "全新浏览器登录后无需输入 Node URL 即可查看并打开在线节点，DOM 满足移动端提取契约"
    status: done
  - action: "重命名能力：实现 PATCH /api/nodes/{id}、同源写保护和页面编辑交互"
    exit_signal: "合法名称持久化，空名称、不存在节点、未登录和跨源请求返回约定错误"
    status: done
  - action: "删除与撤销能力：实现 DELETE /api/nodes/{id}、Token 撤销和 active session 关闭"
    exit_signal: "删除后节点消失、旧 Token 无法重连、在线 session 关闭且其他节点不受影响"
    status: done
  - action: "兼容与范围回归：补齐自动测试并核对绑定、Gateway、客户端契约和 cloud-only 边界"
    exit_signal: "全部验收场景有证据，cloud 测试通过，cloud 外无源码 diff且未引入多用户或额外协议"
    status: done

