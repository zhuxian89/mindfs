roadmap: mindfs-cloud-relay
created: 2026-08-03
last_reviewed: 2026-08-05
compat_principle: "唯一需求来源是未修改客户端/节点的可观察协议；客户端不调用的能力一律为可选愿景，不承诺实现"

items:
  - slug: relay-core-single-instance
    description: "在独立 cloud Go module 中实现单实例绑定、Connector、yamux、HTTP/WS 和 E2EE 透传"
    depends_on: []
    status: done
    feature: 2026-08-03-relay-core-single-instance
    minimal_loop: true
    notes: "V0；只新增 cloud/**；device token 按 roadmap 使用独立 Token Key 做确定性 HMAC 派生且数据库只存 hash"

  - slug: relay-compatibility-suite
    description: "从 cloud 侧建立覆盖绑定、Connector、HTTP、WebSocket、重连和 E2EE 的黑盒兼容测试"
    depends_on: [relay-core-single-instance]
    status: done
    feature: 2026-08-03-relay-compatibility-suite
    minimal_loop: false
    notes: "V0；不得修改或向 server、web、cli 和根模块写入测试代码"

  - slug: relay-deployment-baseline
    description: "提供 cloud 独立容器、配置校验、迁移、健康检查、TLS 反代示例和 SQLite 备份"
    depends_on: [relay-core-single-instance, relay-compatibility-suite]
    status: done
    feature: 2026-08-03-relay-deployment-baseline
    minimal_loop: false
    notes: "V0；cloud 使用独立 go.mod，不修改根 go.mod 和 Makefile；容器只读托管当前 checkout web/dist 的 /mindfs-assets"

  - slug: cloud-node-discovery
    description: "让 bootstrap 管理员通过客户端既有 Relay 控制台契约列出、打开、重命名和删除服务端节点"
    depends_on: [relay-core-single-instance, relay-deployment-baseline]
    status: done
    feature: 2026-08-04-cloud-node-discovery
    minimal_loop: true
    notes: "V0 修正项；2026-08-04 cloud-v0-completion 探查发现原 V0 缺服务端节点发现闭环，回填为 V0；只复用客户端既有 /login、/nodes、GET/PATCH/DELETE /api/nodes、/api/auth/me、/api/auth/logout 契约，不新增协议或多用户；minimal_loop=true 因无此闭环则单用户 V0 不可用；不实现 Token 主动轮换（留 cloud-node-management）"

  - slug: cloud-email-accounts
    description: "实现仅 @qq.com 的邮箱验证码注册、邮箱密码登录和找回密码，并按用户隔离节点绑定与管理"
    depends_on: [relay-core-single-instance, relay-deployment-baseline, cloud-node-discovery]
    status: done
    feature: 2026-08-05-cloud-email-accounts
    minimal_loop: false
    notes: "V1 自建账号能力；注册使用 QQ 邮箱+自设密码+邮箱验证码，后续使用邮箱+自设密码登录；验证码另用于忘记密码。仅允许 @qq.com；使用 QQ SMTP 465 implicit TLS；现有 V0 节点由 bootstrap QQ 邮箱注册后认领。明确不做验证码日常登录、Google/GitHub/LinuxDo OAuth、OIDC、tenant、RBAC 和节点共享。"

  # ── V1：兼容补完（账号能力推进；本地附加服务继续暂停）──
  - slug: relay-local-service-domains
    description: "实现 device 鉴权的服务路由 API 与 {slug}-{nodeId}-relay.{apex} 公网子域名转发（带 X-MindFS-Relay-Service-Slug 头）"
    depends_on: [relay-core-single-instance, relay-deployment-baseline]
    status: planned
    feature: null
    minimal_loop: false
    notes: "【TODO·用户明确暂停】V1 唯一节点驱动兼容特例；当前不实现、不部署，未获用户重新启用前不得要求 wildcard DNS/TLS/OpenResty 操作。节点 PUT/DELETE /api/device/nodes/{id}/services/{slug} 与服务子域名路由契约留待未来重新设计。"

  # ── 非兼容愿景（客户端/节点不调用，不承诺，按目标启用）──
  - slug: cloud-node-management
    description: "提供节点 Token 主动轮换与运营管理后端 API"
    depends_on: [relay-core-single-instance, cloud-node-discovery]
    status: planned
    feature: null
    minimal_loop: false
    notes: "【非兼容·愿景·不承诺】Token 主动轮换；客户端零调用，删除即撤销已在 V0 满足；仅当未来需要运营级 token 安全才做"

  - slug: relay-security-audit
    description: "完善认证、CSRF、限流、请求上限、Token 安全、审计日志和敏感信息清洗"
    depends_on: [relay-core-single-instance, cloud-node-management]
    status: planned
    feature: null
    minimal_loop: false
    notes: "【非兼容·运维可选】邮箱认证自身的验证码/Session/owner 隔离安全约束由 cloud-email-accounts 承担；本条只保留更广泛的审计、请求上限、Token 轮换治理和运营级加固"

  - slug: cloud-node-sharing
    description: "实现节点共享邀请、ACL、访问模式和共享撤销后端 API"
    depends_on: [cloud-node-management, cloud-email-accounts]
    status: planned
