<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · MindFS Relay</title>
  {{template "styles"}}
</head>
<body>
<header class="topbar">{{template "brand"}}<span class="topbar-note">MindFS 节点访问入口</span></header>
<main class="centered">
  <section class="panel" aria-labelledby="page-title">
    <div class="panel-head"><h1 id="page-title">登录 Relay</h1>
    <p id="description" class="subtext">访问你已绑定的 MindFS 节点。</p>
    </div><div class="panel-body">
    <nav class="modes" aria-label="账号操作">
      <button type="button" data-mode="login" aria-pressed="true" aria-controls="login-form">登录</button>
      <button type="button" data-mode="register" aria-pressed="false" aria-controls="register-form">注册</button>
      <button type="button" data-mode="reset" aria-pressed="false" aria-controls="reset-form">找回密码</button>
    </nav>
    <form id="login-form" class="form">
      <div class="field"><label for="login-email">QQ 邮箱</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="你的邮箱@qq.com" required></div>
      <div class="field"><label for="login-password">Relay 密码</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="输入密码" required></div>
    <p id="error" class="notice error" role="alert"></p>
    <p id="hint" class="notice success" role="status"></p>
      <button class="primary submit" type="submit">登录 {{template "arrow-icon"}}</button>
    </form>
    <form id="register-form" class="form" hidden>
      <div class="field"><label for="register-email">QQ 邮箱</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="你的邮箱@qq.com" required></div>
      <div class="field"><label for="register-password">Relay 密码</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8–128 个字符" required></div>
      <div class="field"><label for="register-confirm">确认密码</label><input id="register-confirm" placeholder="再次输入密码" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <div class="field"><label for="register-code">邮箱验证码</label><div class="inline"><input id="register-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" required><button type="button" data-send="register">发送验证码</button></div></div>
      <button class="primary submit" type="submit">注册并登录 {{template "arrow-icon"}}</button>
    </form>
    <form id="reset-form" class="form" hidden>
      <div class="field"><label for="reset-email">QQ 邮箱</label><input id="reset-email" name="email" type="email" autocomplete="email" placeholder="你的邮箱@qq.com" required></div>
      <div class="field"><label for="reset-password">新 Relay 密码</label><input id="reset-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8–128 个字符" required></div>
      <div class="field"><label for="reset-code">邮箱验证码</label><div class="inline"><input id="reset-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" required><button type="button" data-send="reset">发送验证码</button></div></div>
      <button class="primary submit" type="submit">重置密码 {{template "arrow-icon"}}</button>
    </form>
    {{template "noscript"}}
    </div>
  </section>
  <p class="page-note">使用 QQ 邮箱管理你的 Relay 账号</p>
</main>
{{template "helpers"}}
<script>
const next = {{.Next}};
const errorElement = document.getElementById("error");
const hintElement = document.getElementById("hint");
const modes = [...document.querySelectorAll("[data-mode]")];
const forms = Object.fromEntries(["login", "register", "reset"].map(name => [name, document.getElementById(name + "-form")]));
const copy = {
  login: ["登录 Relay", "访问你已绑定的 MindFS 节点。"],
  register: ["创建 Relay 账号", "验证 QQ 邮箱，开始管理你的节点。"],
  reset: ["重置密码", "通过邮箱验证，设置新的 Relay 密码。"]
};
let activeMode = "login";
let submitting = false;
function clearMessages() {
  errorElement.textContent = "";
  hintElement.textContent = "";
  document.querySelectorAll("[aria-invalid]").forEach(input => input.removeAttribute("aria-invalid"));
}
function show(mode) {
  const email = forms[activeMode].elements.email.value;
  for (const [name, form] of Object.entries(forms)) form.hidden = name !== mode;
  for (const button of modes) button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
  if (!forms[mode].elements.email.value) forms[mode].elements.email.value = email;
  activeMode = mode;
  document.querySelector("main").classList.toggle("register-mode", mode === "register");
  const submit = forms[mode].querySelector('[type="submit"]');
  forms[mode].insertBefore(errorElement, submit);
  forms[mode].insertBefore(hintElement, submit);
  document.getElementById("page-title").textContent = copy[mode][0];
  document.getElementById("description").textContent = copy[mode][1];
  document.title = copy[mode][0] + " · MindFS Relay";
  clearMessages();
}
for (const button of modes) button.addEventListener("click", () => show(button.dataset.mode));
function countdown(button, seconds) {
  const until = Date.now() + seconds * 1000;
  function update() {
    const left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    button.disabled = left > 0;
    button.textContent = left ? left + " 秒后重发" : "发送验证码";
    if (!left) clearInterval(timer);
  }
  const timer = setInterval(update, 1000);
  update();
}
for (const button of document.querySelectorAll("[data-send]")) {
  button.addEventListener("click", async () => {
    const mode = button.dataset.send;
    const form = forms[mode];
    if (!form.elements.email.reportValidity()) return;
    clearMessages();
    const restore = Relay.busy(button, "发送中…");
    let cooldown = 0;
    try {
      const path = mode === "register" ? "/api/auth/register/request-code" : "/api/auth/password/request-code";
      const body = await Relay.request(path, Relay.json("POST", {email: form.elements.email.value.trim()}));
      cooldown = Number(body.resend_after_seconds) || 60;
      if (activeMode === mode) hintElement.textContent = "验证码已发送，请查看邮箱。";
    } catch (error) {
      if (activeMode === mode) errorElement.textContent = Relay.message(error.message);
    } finally {
      restore();
      if (cooldown > 0) countdown(button, cooldown);
    }
  });
}
for (const [mode, form] of Object.entries(forms)) {
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (submitting) return;
    clearMessages();
    const data = Object.fromEntries(new FormData(form));
    if (mode === "register" && data.password !== data.confirm_password) {
      errorElement.textContent = "两次密码输入不一致，请重新确认。";
      form.elements.confirm_password.focus();
      return;
    }
    submitting = true;
    for (const button of modes) button.disabled = true;
    const restore = Relay.busy(form.querySelector('[type="submit"]'), mode === "reset" ? "重置中…" : "正在登录…");
    try {
      const path = {login: "/api/auth/login", register: "/api/auth/register", reset: "/api/auth/password/reset"}[mode];
      const body = {email: data.email.trim()};
      if (mode === "reset") body.new_password = data.new_password;
      else body.password = data.password;
      if (mode !== "login") body.code = data.code;
      await Relay.request(path, Relay.json("POST", body));
      if (mode === "reset") {
        form.reset();
        show("login");
        forms.login.elements.email.value = data.email;
        forms.login.elements.password.value = "";
        hintElement.textContent = "密码已重置，请使用新密码登录。";
        forms.login.elements.password.focus();
      } else {
        location.assign(next);
      }
    } catch (error) {
      errorElement.textContent = Relay.message(error.message);
      if (error.message === "invalid_credentials") form.elements.password?.setAttribute("aria-invalid", "true");
    } finally {
      submitting = false;
      restore();
      for (const button of modes) button.disabled = false;
    }
  });
}
</script>
</body>
</html>
